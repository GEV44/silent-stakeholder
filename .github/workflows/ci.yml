name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      FIRECODE_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[demo,dev]" pylint

      - name: Protected-file policy
        run: python scripts/production_gate.py --policy-only

      - name: Tests
        run: python -m pytest -p no:cacheprovider

      - name: Ruff
        run: python -m ruff check --no-cache .

      - name: Security lint
        run: python -m ruff check --no-cache --select S --ignore S311 src scripts report.py

      - name: Type safety
        run: python -m mypy src scripts report.py

      - name: Independent error lint
        run: pylint --errors-only $(git ls-files '*.py')

      - name: Bytecode and dependency integrity
        run: |
          python -m compileall -q src tests scripts examples
          python -m pip check
