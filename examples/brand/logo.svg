<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 88" width="100" height="88"
     role="img" aria-label="The Silent Stakeholder">
  <title>The Silent Stakeholder</title>
  <desc>A speech bubble with a bubble-shaped hole punched through it: what users said is
  solid, what they meant is the void inside it — same shape, never filled.</desc>
  <!-- Single path, evenodd fill: the inner bubble is a hole, not a second shape, so the
       mark works in one colour on any ground. `currentColor` lets a host page set it. -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M8 12 h84 a6 6 0 0 1 6 6 v40 a6 6 0 0 1 -6 6 h-46 l-16 16 v-16 h-22
           a6 6 0 0 1 -6 -6 v-40 a6 6 0 0 1 6 -6 z
           M34 28 h34 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-14 l-9 9 v-9 h-11
           a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4 z"/>
</svg>
